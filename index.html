<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Will you be my Valentine?</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800&display=swap" rel="stylesheet">
    
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    
    <style>
        :root {
            --primary-color: #ff4d6d;
            --primary-hover: #e0314f;
            --bg-color: #fff0f3;
            --text-color: #590d22;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background-color: var(--bg-color);
            font-family: 'Nunito', sans-serif;
            overflow: hidden;
        }

        .card {
            background: #ffffff;
            padding: 40px;
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(255, 77, 109, 0.15);
            text-align: center;
            max-width: 450px;
            width: 90%;
            z-index: 10;
        }

        .main-image {
            width: 100%;
            max-width: 280px;
            border-radius: 16px;
            margin-bottom: 24px;
            object-fit: cover;
            box-shadow: 0 8px 16px rgba(0,0,0,0.1);
        }

        h1 {
            color: var(--text-color);
            font-size: 26px;
            margin-bottom: 30px;
            font-weight: 800;
        }

        .button-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            position: relative;
            min-height: 60px;
        }

        button {
            border: none;
            border-radius: 50px;
            font-family: inherit;
            font-size: 18px;
            font-weight: 800;
            cursor: pointer;
            transition: transform 0.2s ease, background-color 0.2s ease;
        }

        .btn-yes {
            background-color: var(--primary-color);
            color: white;
            padding: 15px 40px;
            box-shadow: 0 4px 15px rgba(255, 77, 109, 0.4);
            transition: all 0.3s ease;
        }

        .btn-yes:hover {
            background-color: var(--primary-hover);
            transform: scale(1.05);
        }

        .btn-no {
            background-color: #f8f9fa;
            color: #6c757d;
            padding: 15px 40px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            border: 1px solid #dee2e6;
            transition: left 0.3s cubic-bezier(0.25, 0.8, 0.25, 1), top 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

    <div class="card" id="mainCard">
        <img src="neymar.jpg" alt="Valentine Image" class="main-image" id="displayImage">
        
        <h1 id="questionText">Will you be my(yeasin's) Valentine? 💖</h1>

        <div class="button-container" id="btnContainer">
            <button class="btn-yes" id="yesBtn">Yes 🥰</button>
            <button class="btn-no" id="noBtn">No 🙅‍♀️</button>
        </div>
    </div>

    <script>
        const yesBtn = document.getElementById('yesBtn');
        const noBtn = document.getElementById('noBtn');
        const displayImage = document.getElementById('displayImage');
        const questionText = document.getElementById('questionText');
        const btnContainer = document.getElementById('btnContainer');

        let yesScale = 1;
        const messages = ["No 🙅‍♀️", "Are you sure? 🥺", "Really sure?", "Think again! 😭", "Last chance!", "Heart broken 💔"];
        let messageIndex = 0;

        function evadeCursor() {
            noBtn.style.position = 'absolute';
            const padding = 20;
            const maxX = window.innerWidth - noBtn.offsetWidth - padding;
            const maxY = window.innerHeight - noBtn.offsetHeight - padding;
            const randomX = Math.max(padding, Math.floor(Math.random() * maxX));
            const randomY = Math.max(padding, Math.floor(Math.random() * maxY));

            noBtn.style.left = `${randomX}px`;
            noBtn.style.top = `${randomY}px`;

            if (messageIndex < messages.length - 1) {
                messageIndex++;
                noBtn.innerText = messages[messageIndex];
            }

            yesScale += 0.3;
            yesBtn.style.transform = `scale(${yesScale})`;
        }

        noBtn.addEventListener('mouseover', evadeCursor);
        noBtn.addEventListener('touchstart', (e) => {
            e.preventDefault();
            evadeCursor();
        });

        // Function to trigger the confetti celebration
        function fireConfetti() {
            var duration = 4 * 1000; // 4 seconds of celebration
            var animationEnd = Date.now() + duration;
            var defaults = { startVelocity: 30, spread: 360, ticks: 60, zIndex: 100 };

            function randomInRange(min, max) {
                return Math.random() * (max - min) + min;
            }

            var interval = setInterval(function() {
                var timeLeft = animationEnd - Date.now();

                if (timeLeft <= 0) {
                    return clearInterval(interval);
                }

                var particleCount = 50 * (timeLeft / duration);
                // Shoot confetti from the left and right edges
                confetti(Object.assign({}, defaults, { 
                    particleCount, 
                    origin: { x: randomInRange(0.1, 0.3), y: Math.random() - 0.2 } 
                }));
                confetti(Object.assign({}, defaults, { 
                    particleCount, 
                    origin: { x: randomInRange(0.7, 0.9), y: Math.random() - 0.2 } 
                }));
            }, 250);
        }

        yesBtn.addEventListener('click', () => {
            // Update Image and Text
            displayImage.src = "https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExcDFyYnh6Mncyd2U0Mmp2c2g1cWl1bTNvcm12anY5MW13YXk1YzIwaiZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/MDJ9IbxxvDUQM/giphy.gif";
            questionText.innerText = "YAY! I knew you'd say Yes! ❤️🎉";
            questionText.style.color = "#ff4d6d";
            
            // Hide Buttons
            btnContainer.classList.add('hidden');
            
            // Trigger the celebration!
            fireConfetti();
        });
    </script>

</body>
</html>
